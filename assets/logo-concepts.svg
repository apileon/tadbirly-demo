<svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="520" fill="#edf1e8"/>

  <text x="500" y="46" text-anchor="middle" font-size="19" font-weight="700" fill="#232a22">Tadbirly — logo directions</text>
  <text x="500" y="70" text-anchor="middle" font-size="13" fill="#7f877c">“The next move is yours”</text>

  <!-- ============ 1. PAWN ============ -->
  <rect x="115" y="100" width="170" height="170" rx="40" fill="#2d5a3d"/>
  <circle cx="200" cy="155" r="22" fill="#ffffff"/>
  <rect x="188" y="176" width="24" height="10" rx="5" fill="#ffffff"/>
  <path d="M181 232 L190 190 L210 190 L219 232 Z" fill="#ffffff"/>
  <rect x="170" y="230" width="60" height="14" rx="7" fill="#ffffff"/>
  <circle cx="243" cy="132" r="11" fill="#c9f24d"/>

  <text x="200" y="300" text-anchor="middle" font-size="15" font-weight="800" fill="#232a22">1 · The Pawn</text>
  <text x="200" y="322" text-anchor="middle" font-size="11.5" fill="#7f877c">Every student starts as a pawn.</text>
  <text x="200" y="340" text-anchor="middle" font-size="11.5" fill="#7f877c">The dot = your next move.</text>

  <!-- ============ 2. RISING STEPS ============ -->
  <rect x="415" y="100" width="170" height="170" rx="40" fill="#232a22"/>
  <rect x="452" y="196" width="26" height="42" rx="9" fill="#ffffff" opacity="0.55"/>
  <rect x="487" y="172" width="26" height="66" rx="9" fill="#ffffff" opacity="0.8"/>
  <rect x="522" y="146" width="26" height="92" rx="9" fill="#ffffff"/>
  <circle cx="535" cy="124" r="12" fill="#c9f24d"/>

  <text x="500" y="300" text-anchor="middle" font-size="15" font-weight="800" fill="#232a22">2 · The Climb</text>
  <text x="500" y="322" text-anchor="middle" font-size="11.5" fill="#7f877c">Events stack into a record.</text>
  <text x="500" y="340" text-anchor="middle" font-size="11.5" fill="#7f877c">Ties directly to your ranking.</text>

  <!-- ============ 3. T MONOGRAM ============ -->
  <rect x="715" y="100" width="170" height="170" rx="40" fill="#ffffff" stroke="#2d5a3d" stroke-width="5"/>
  <rect x="748" y="146" width="104" height="26" rx="11" fill="#2d5a3d"/>
  <rect x="787" y="146" width="26" height="86" rx="11" fill="#2d5a3d"/>
  <rect x="826" y="132" width="26" height="26" rx="9" fill="#c9f24d"/>

  <text x="800" y="300" text-anchor="middle" font-size="15" font-weight="800" fill="#232a22">3 · The Monogram</text>
  <text x="800" y="322" text-anchor="middle" font-size="11.5" fill="#7f877c">Simplest. Reads clearly at</text>
  <text x="800" y="340" text-anchor="middle" font-size="11.5" fill="#7f877c">tiny sizes like a home icon.</text>

  <!-- ============ WORDMARK ROW ============ -->
  <line x1="115" y1="378" x2="885" y2="378" stroke="#dfe5d8" stroke-width="2"/>
  <text x="115" y="406" font-size="12" font-weight="700" fill="#7f877c">IN THE APP HEADER</text>

  <!-- mark + wordmark -->
  <rect x="115" y="424" width="54" height="54" rx="16" fill="#2d5a3d"/>
  <circle cx="142" cy="442" r="7.5" fill="#ffffff"/>
  <path d="M133 466 L136 450 L148 450 L151 466 Z" fill="#ffffff"/>
  <rect x="128" y="465" width="28" height="6" rx="3" fill="#ffffff"/>

  <text x="185" y="452" font-size="30" font-weight="800" fill="#232a22">Tadbir<tspan fill="#2d5a3d">ly</tspan></text>
  <text x="186" y="472" font-size="12" font-weight="600" fill="#7f877c" letter-spacing="1.5">THE NEXT MOVE IS YOURS</text>

  <!-- small sizes preview -->
  <text x="640" y="406" font-size="12" font-weight="700" fill="#7f877c">AT HOME-SCREEN SIZE</text>
  <rect x="640" y="424" width="54" height="54" rx="16" fill="#2d5a3d"/>
  <circle cx="667" cy="442" r="7.5" fill="#ffffff"/>
  <path d="M658 466 L661 450 L673 450 L676 466 Z" fill="#ffffff"/>
  <rect x="653" y="465" width="28" height="6" rx="3" fill="#ffffff"/>

  <rect x="710" y="432" width="38" height="38" rx="11" fill="#232a22"/>
  <rect x="718" y="452" width="6" height="11" rx="2.5" fill="#ffffff" opacity="0.6"/>
  <rect x="726" y="446" width="6" height="17" rx="2.5" fill="#ffffff" opacity="0.85"/>
  <rect x="734" y="440" width="6" height="23" rx="2.5" fill="#ffffff"/>

  <rect x="764" y="432" width="38" height="38" rx="11" fill="#ffffff" stroke="#2d5a3d" stroke-width="2.5"/>
  <rect x="773" y="444" width="21" height="6" rx="2.5" fill="#2d5a3d"/>
  <rect x="781" y="444" width="6" height="19" rx="2.5" fill="#2d5a3d"/>
</svg>
