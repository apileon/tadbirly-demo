  <rect x="615" y="80" width="150" height="150" rx="40" fill="#c9f24d"/>
  <circle cx="690" cy="135" r="23" fill="#14532d"/>
  <rect x="681" y="153" width="18" height="8" rx="4" fill="#14532d"/>
  <path d="M676 192 L682 162 L698 162 L704 192 Z" fill="#14532d"/>
