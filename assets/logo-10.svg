  <rect x="652" y="350" width="72" height="18" rx="9" fill="#c9f24d"/>
  <rect x="679" y="350" width="18" height="62" rx="9" fill="#c9f24d"/>
  <rect x="662" y="338" width="72" height="18" rx="9" fill="#14532d"/>
  <rect x="689" y="338" width="18" height="62" rx="9" fill="#14532d"/>
  <text x="690" y="476" text-anchor="middle" font-size="12.5" font-weight="700" fill="#111511">9 · Double T</text>

  <!-- 10 STAR BADGE -->
  <rect x="805" y="300" width="150" height="150" rx="40" fill="url(#g4)"/>
  <path d="M880 327 L889.4 352.1 L916.1 353.3 L895.2 369.9 L902.3 395.7 L880 381 L857.7 395.7 L864.8 369.9 L843.9 353.3 L870.6 352.1 Z" fill="#fff"/>
