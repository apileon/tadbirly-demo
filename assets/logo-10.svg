  <rect x="425" y="80" width="150" height="150" rx="40" fill="url(#g2)"/>
  <path d="M500 106 Q508 147 549 155 Q508 163 500 204 Q492 163 451 155 Q492 147 500 106 Z" fill="#fff"/>
  <path d="M545 112 Q548 126 562 129 Q548 132 545 146 Q542 132 528 129 Q542 126 545 112 Z" fill="#fff" opacity="0.85"/>
