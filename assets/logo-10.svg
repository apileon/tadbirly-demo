  <rect width="1000" height="520" fill="#f4f6f1"/>
  <text x="500" y="38" text-anchor="middle" font-size="18" font-weight="800" fill="#111511">Tadbirly — 10 marks</text>

  <!-- 1 GRADIENT PAWN -->
  <rect x="45" y="80" width="150" height="150" rx="40" fill="url(#g1)"/>
