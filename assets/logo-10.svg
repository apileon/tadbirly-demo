  <!-- 8 CHAT PAWN -->
  <rect x="425" y="300" width="150" height="150" rx="40" fill="#c9f24d"/>
  <rect x="455" y="332" width="90" height="66" rx="22" fill="#14532d"/>
  <path d="M480 394 L480 420 L504 396 Z" fill="#14532d"/>
  <circle cx="500" cy="354" r="9" fill="#fff"/>
  <path d="M490 384 L494 368 L506 368 L510 384 Z" fill="#fff"/>
